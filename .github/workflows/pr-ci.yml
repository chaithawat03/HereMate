name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/m0.test.mjs
      - run: node --check tests/m0.test.mjs
      - name: Verify opt-in Android Guest Login source and profile isolation (no Firebase credentials)
        run: node --test tests/m0-5-guest-auth.test.mjs
      - name: Validate registered Firebase Staging identifiers (no backend access)
        run: node --test tests/m0-5-firebase-config.test.mjs
      - name: Validate Firestore Auth adapters and deny-all client rules (offline)
        run: |
          node --check backend/auth/firestore-adapters.mjs
          node --test tests/m0-5-firestore-adapters.test.mjs tests/m0-5-firestore-rules.test.mjs
      - name: Validate offline Cloud Run Phone + Password auth contract
        run: |
          node --check backend/auth/phone-login.mjs
          node --check backend/auth/http.mjs
          node --test tests/m0-5-phone-auth.test.mjs
      - name: Validate read-only M0.5 inventory and staging project guards
        run: |
          bash -n scripts/m0-5-inventory.sh
          node --test tests/m0-5-inventory.test.mjs

  firestore-emulator:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test-only SDK (not mobile application)
        run: npm install --prefix firebase/rules-tests --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Verify Firestore rules with real OFFLINE demo emulator
        env:
          GCLOUD_PROJECT: demo-heremate-m053
          FIREBASE_CONFIG: '{"projectId":"demo-heremate-m053"}'
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          npx --yes firebase-tools@15.34.0 emulators:exec \
            --only firestore \
            --project demo-heremate-m053 \
            --config firebase.json \
            "node --test firebase/rules-tests/rules.test.mjs"

  mobile:
    needs: [foundation, firestore-emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript strict typecheck
        run: npm run typecheck
      - name: Unit and configuration tests
        run: npm test
      - name: Validate Expo configuration without secrets
        run: |
          ./node_modules/.bin/expo config --json > /tmp/heremate-expo-config.json
          node -e "const c=require('/tmp/heremate-expo-config.json'); if(c.owner !== 'smartyyys-team' || c.slug !== 'heremate')process.exit(1)"
      - name: Test EAS release and build gates
        run: node --test tests/release-gates.test.mjs
      - name: Android/iOS JavaScript Metro export smoke
        run: ./node_modules/.bin/expo export --platform all --output-dir "$RUNNER_TEMP/heremate-export"
      - name: Test staging security exception (fail closed)
        run: node --test tests/security-staging.test.mjs
      - name: Test private My Drive OAuth delivery (no credentials)
        run: node --test tests/drive-delivery.test.mjs
      - name: Test WIF and OAuth read-only preflight (mocked, no credentials)
        run: node --test tests/drive-preflight.test.mjs
      - name: Validate Expo APK redirect trust boundaries (no network)
        run: node --test tests/drive-redirect.test.mjs
      - name: Audit dependencies with approved M0.1 staging exception only
        run: node scripts/check-staging-audit.mjs
