name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/m0.test.mjs
      - run: node --check tests/m0.test.mjs
      - name: Verify owner-approved Guest-only trial exception, exact hashes and expiry
        run: node --test tests/security-guest-staging.test.mjs
      - name: Test M2.4 dormant HTTPS transport against server HTTP handler (offline)
        run: node --test tests/m2-4-staging-transport.test.mjs
      - name: Test M2.4 Staging build packaging and approval-only deploy guard
        run: node --test tests/m2-4-release-packaging.test.mjs
      - name: Test M2.4C Android integration remains unmounted until secure Staging approval
        run: node --test tests/m2-4c-android-integration-gate.test.mjs
      - name: Test M2.3 authorized real friend map and status privacy (offline)
        run: node --test tests/m2-3-friend-map-privacy.test.mjs
      - name: Test M2.2 foreground-only sharing and remote stop lifecycle (offline)
        run: node --test tests/m2-2-foreground-share.test.mjs
      - name: Test M2.1 transactional backend privacy and bearer HTTP contract (offline)
        run: |
          node --check backend/location/location-service.mjs
          node --check backend/location/firestore-location-adapters.mjs
          node --check backend/location/http.mjs
          node --test tests/m2-1-server-location.test.mjs
      - name: Test M2.0 offline privacy and no remote GPS contract
        run: node --test tests/m2-0-location-privacy.test.mjs
      - name: Test M1 friends contracts and no GPS publishing
        run: node --test tests/m1-friends-contract.test.mjs
      - name: Test M1 UX theme/light/dark and TH/EN translation/persistence
        run: node --test tests/m1-ui-preferences.test.mjs
      - name: Test M1.1 Google identity linking contract (synthetic tokens only)
        run: node --test tests/m1-1-google-account-flow.test.mjs
      - name: Verify M1.1B native Google OAuth config and rollout
        run: node --test tests/m1-1b-native-google.test.mjs
      - name: Test M1.0 owner-only Firestore profiles and feature isolation
        run: node --test tests/m1-0-private-profile.test.mjs
      - name: Test M0.5.5.1 Android permission-dialog lifecycle
        run: node --test tests/m0-5-5-1-permission-lifecycle.test.mjs
      - name: Test M0.5.5 foreground GPS opt-in, lockfile and no backend publishing
        run: node --test tests/m0-5-5-local-gps.test.mjs
      - name: Test M0.5.4 fold-responsive layout and Safe Area integration
        run: node --test tests/m0-5-4-responsive-layout.test.mjs
      - name: Verify opt-in Android Guest Login source and profile isolation (no Firebase credentials)
        run: node --test tests/m0-5-guest-auth.test.mjs
      - name: Validate registered Firebase Staging identifiers (no backend access)
        run: node --test tests/m0-5-firebase-config.test.mjs
      - name: Validate Firestore Auth adapters and deny-all client rules (offline)
        run: |
          node --check backend/auth/firestore-adapters.mjs
          node --test tests/m0-5-firestore-adapters.test.mjs tests/m0-5-firestore-rules.test.mjs
      - name: Validate offline Cloud Run Phone + Password auth contract
        run: |
          node --check backend/auth/phone-login.mjs
          node --check backend/auth/http.mjs
          node --test tests/m0-5-phone-auth.test.mjs
      - name: Validate read-only M0.5 inventory and staging project guards
        run: |
          bash -n scripts/m0-5-inventory.sh
          node --test tests/m0-5-inventory.test.mjs

  firestore-emulator:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test-only SDK (not mobile application)
        run: npm install --prefix firebase/rules-tests --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Verify Firestore rules with real OFFLINE demo emulator
        env:
          GCLOUD_PROJECT: demo-heremate-m053
          FIREBASE_CONFIG: '{"projectId":"demo-heremate-m053"}'
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          npx --yes firebase-tools@15.34.0 emulators:exec \
            --only firestore \
            --project demo-heremate-m053 \
            --config firebase.json \
            "node --test firebase/rules-tests/rules.test.mjs"

  location-admin-emulator:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase Admin runtime from committed lockfile
        run: npm ci --prefix backend/location-runtime --ignore-scripts --no-audit --no-fund
      - name: Audit standalone Firebase Admin runtime for High/Critical advisories
        run: npm audit --prefix backend/location-runtime --omit=dev --audit-level=high
      - name: Build isolated Staging runtime container (NO deploy/no credentials)
        run: |
          docker build -f backend/location-runtime/Dockerfile -t heremate-m2-ci .
          docker run --rm --entrypoint node heremate-m2-ci --check main.mjs
          if docker run --rm heremate-m2-ci; then
            echo "Unexpected unguarded location server startup" >&2
            exit 1
          fi
      - name: Record Node base manifest digest for later explicit pin/review
        run: docker buildx imagetools inspect node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205 | grep '^Digest:'
      - name: Verify staging boot defaults and bounded HTTP edge (offline)
        run: |
          node --check backend/location-runtime/main.mjs
          node --check backend/location-runtime/edge.mjs
          node --check backend/location-runtime/emulator.test.mjs
          node --test backend/location-runtime/edge.test.mjs
      - name: Real Firebase Admin Firestore transaction tests in isolated demo emulator
        env:
          GCLOUD_PROJECT: demo-heremate-m053
          FIREBASE_CONFIG: '{"projectId":"demo-heremate-m053"}'
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          npx --yes firebase-tools@15.34.0 emulators:exec \
            --only firestore \
            --project demo-heremate-m053 \
            --config firebase.json \
            "node --test backend/location-runtime/emulator.test.mjs"
      - name: Actual Firebase Admin Auth token verification + revocation (isolated Auth Emulator)
        env:
          GCLOUD_PROJECT: demo-heremate-m053
          FIREBASE_CONFIG: '{"projectId":"demo-heremate-m053"}'
          FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:9099'
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
          GOOGLE_APPLICATION_CREDENTIALS: ''
        run: |
          npx --yes firebase-tools@15.34.0 emulators:exec \
            --only auth,firestore \
            --project demo-heremate-m053 \
            --config firebase.json \
            "node --test backend/location-runtime/auth-emulator.test.mjs"

  mobile:
    needs: [foundation, firestore-emulator, location-admin-emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript strict typecheck
        run: npm run typecheck
      - name: Unit and configuration tests
        run: npm test
      - name: Validate Expo configuration without secrets
        run: |
          ./node_modules/.bin/expo config --json > /tmp/heremate-expo-config.json
          node -e "const c=require('/tmp/heremate-expo-config.json'); if(c.owner !== 'smartyyys-team' || c.slug !== 'heremate')process.exit(1)"
      - name: Android and iOS Guest-enabled native Metro export smoke (no credentials)
        env:
          EXPO_PUBLIC_ENVIRONMENT: staging
          EXPO_PUBLIC_ENABLE_FIREBASE_GUEST: 'true'
        run: |
          ./node_modules/.bin/expo export --platform all --output-dir "$RUNNER_TEMP/heremate-guest-export"
          node - "$RUNNER_TEMP/heremate-guest-export" <<'JS'
          const fs=require('node:fs');
          const path=require('node:path');
          const root=process.argv[2];
          const bundles={android:[],ios:[]};
          const scan=dir=>{
            for(const item of fs.readdirSync(dir,{withFileTypes:true})){
              const p=path.join(dir,item.name);
              if(item.isDirectory())scan(p);
              else if(item.name.endsWith('.hbc')){
                const platform=p.split(path.sep).find(segment=>segment==='android'||segment==='ios');
                if(platform) bundles[platform].push({path:p,size:fs.statSync(p).size});
              }
            }
          };
          scan(root);
          for(const platform of ['android','ios']) {
            if(bundles[platform].length!==1 || bundles[platform][0].size<100000)
              throw Error(platform+' guest Hermes bundle missing or unexpectedly small');
          }
          if(!fs.existsSync(path.join(root,'metadata.json'))) throw Error('Metro metadata missing');
          console.log('Guest-enabled Android/iOS Hermes bundles present, staging flag set and Metro compilation succeeded');
          JS
      - name: Test EAS release and build gates
        run: node --test tests/release-gates.test.mjs
      - name: Android/iOS JavaScript Metro export smoke
        run: ./node_modules/.bin/expo export --platform all --output-dir "$RUNNER_TEMP/heremate-export"
      - name: Test staging security exception (fail closed)
        run: node --test tests/security-staging.test.mjs
      - name: Test private My Drive OAuth delivery (no credentials)
        run: node --test tests/drive-delivery.test.mjs
      - name: Test WIF and OAuth read-only preflight (mocked, no credentials)
        run: node --test tests/drive-preflight.test.mjs
      - name: Validate Expo APK redirect trust boundaries (no network)
        run: node --test tests/drive-redirect.test.mjs
      - name: Inventory Guest staging dependencies (diagnostic, not waiver)
        run: node scripts/report-guest-dependency-audit.mjs
      - name: Audit dependencies with approved M0.1 staging exception only
        run: node scripts/check-staging-audit.mjs
      - name: Android native config plugin prebuild smoke (no cloud credentials)
        env:
          CI: '1'
          EXPO_PUBLIC_ENVIRONMENT: staging
          EXPO_PUBLIC_ENABLE_FIREBASE_GUEST: 'true'
          EXPO_PUBLIC_ENABLE_GOOGLE_SIGNIN: 'true'
        run: ./node_modules/.bin/expo prebuild --platform android --no-install --clean
