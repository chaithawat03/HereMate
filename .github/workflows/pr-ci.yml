name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/m0.test.mjs
      - run: node --check tests/m0.test.mjs

  mobile:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript strict typecheck
        run: npm run typecheck
      - name: Unit and configuration tests
        run: npm test
      - name: Validate Expo configuration without secrets
        run: |
          npm run config > /tmp/heremate-expo-config.json
          node -e "const c=require('/tmp/heremate-expo-config.json'); if(c.owner !== 'smartyyys-team' || c.slug !== 'heremate')process.exit(1)"
      - name: Audit production dependencies (high severity)
        run: npm audit --omit=dev --audit-level=high
