name: Staging Android EAS Build (gated)

# PAUSED by project owner 2026-10-28: no daily Staging preflight runs.
# The former schedule was 17 7 * * * UTC. Restore explicitly on resumption.
on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Choose preflight (no build/uploads) or Android build"
        required: true
        type: choice
        options:
          - preflight
          - build
        default: preflight

permissions:
  contents: read

concurrency:
  group: heremate-staging-eas-main
  cancel-in-progress: false

jobs:
  preflight-private-drive:
    # Runs without any EAS build or Google Drive write. Preserves WIF workflow_ref
    # restrictions because it lives in the same staging-eas-build.yml.
    if: >-
      github.repository == 'chaithawat03/HereMate' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'preflight'))
    environment: staging-drive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate exact staging destination settings (no secrets)
        env:
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_WIF_SERVICE_ACCOUNT: ${{ vars.GOOGLE_WIF_SERVICE_ACCOUNT }}
          GOOGLE_WIF_PROVIDER: ${{ vars.GOOGLE_WIF_PROVIDER }}
          DRIVE_EXPECTED_OWNER_EMAIL: ${{ vars.DRIVE_EXPECTED_OWNER_EMAIL }}
        run: |
          set -euo pipefail
          test "$DRIVE_FOLDER_ID" = "1Q0zgRbKdt9l6ZeEU4KILSf_1vUjQ2gmo"
          test "$GCP_PROJECT_ID" = "heremate"
          test "$GOOGLE_WIF_SERVICE_ACCOUNT" = "heremate-drive-ci@heremate.iam.gserviceaccount.com"
          test "$GOOGLE_WIF_PROVIDER" = "projects/976775896533/locations/global/workloadIdentityPools/heremate-gh/providers/github"
          test -n "$DRIVE_EXPECTED_OWNER_EMAIL"
      - name: Authenticate via GitHub OIDC (no service account key)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_WIF_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Read only dedicated Secret Manager OAuth version
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          umask 077
          gcloud secrets versions access latest --project="$GCP_PROJECT_ID" --secret=heremate-staging-drive-oauth > "$RUNNER_TEMP/drive-oauth.json"
          test -s "$RUNNER_TEMP/drive-oauth.json"
      - name: Verify refresh token scope and existing Restricted Drive folder (read-only)
        env:
          DRIVE_OAUTH_SECRET_JSON_FILE: ${{ runner.temp }}/drive-oauth.json
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          DRIVE_EXPECTED_OWNER_EMAIL: ${{ vars.DRIVE_EXPECTED_OWNER_EMAIL }}
        run: node scripts/preflight-private-drive.mjs
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/drive-oauth.json"

  verify-reviewed-merge:
    if: >-
      github.repository == 'chaithawat03/HereMate' &&
      github.ref == 'refs/heads/main' &&
      vars.STAGING_EAS_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'build')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require reviewed green PR merge, not arbitrary main push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release.mjs verify-merge
      - name: Test release and exception guards without credentials
        run: node --test tests/m0.test.mjs tests/security-staging.test.mjs tests/security-guest-staging.test.mjs tests/release-gates.test.mjs
      - name: Validate existing Expo project identity (never create)
        env:
          STAGING_EAS_PROJECT_ID: ${{ vars.STAGING_EAS_PROJECT_ID }}
        run: node scripts/verify-release.mjs validate-config

  build-android-staging:
    needs: verify-reviewed-merge
    if: >-
      github.repository == 'chaithawat03/HereMate' &&
      github.ref == 'refs/heads/main' &&
      vars.STAGING_EAS_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'build')
    environment: staging-eas
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact locked packages
        run: npm ci --no-audit --no-fund
      - name: Verify staging-only dependency audit before Expo access
        run: node scripts/check-staging-audit.mjs
      - name: Configure authenticated Expo EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Cloud-build internal Android Guest staging APK and await result
        run: eas build --platform android --profile android-guest-staging --non-interactive --wait --json > "$RUNNER_TEMP/eas-build.json"
      - name: Verify finished APK and staging manifest
        run: node scripts/verify-release.mjs verify-build "$RUNNER_TEMP/eas-build.json" "$RUNNER_TEMP/build-manifest.json"
      - name: Retain verified EAS manifest for Drive delivery
        uses: actions/upload-artifact@v4
        with:
          name: heremate-android-staging-manifest
          path: ${{ runner.temp }}/build-manifest.json
          if-no-files-found: error
          retention-days: 7

  publish-android-to-private-drive:
    needs: build-android-staging
    if: >-
      github.repository == 'chaithawat03/HereMate' &&
      github.ref == 'refs/heads/main' &&
      vars.STAGING_EAS_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'build') &&
      vars.STAGING_DRIVE_ENABLED == 'true'
    environment: staging-drive
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download EAS manifest from this successful workflow run
        uses: actions/download-artifact@v4
        with:
          name: heremate-android-staging-manifest
          path: ${{ runner.temp }}/staging-build
      - name: Authenticate to Google Cloud via short-lived GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_WIF_SERVICE_ACCOUNT }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Read only owner OAuth credentials from Secret Manager
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          umask 077
          gcloud secrets versions access latest --project="$GCP_PROJECT_ID" --secret=heremate-staging-drive-oauth > "$RUNNER_TEMP/drive-oauth.json"
          test -s "$RUNNER_TEMP/drive-oauth.json"
      - name: Upload APK and verified manifest privately with owner OAuth
        env:
          DRIVE_OAUTH_SECRET_JSON_FILE: ${{ runner.temp }}/drive-oauth.json
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          DRIVE_EXPECTED_OWNER_EMAIL: ${{ vars.DRIVE_EXPECTED_OWNER_EMAIL }}
        run: |
          set -euo pipefail
          node scripts/publish-staging-drive.mjs "$RUNNER_TEMP/staging-build/build-manifest.json" "$RUNNER_TEMP/drive-delivery-receipt.json"
      - name: Retain non-secret Drive receipt
        uses: actions/upload-artifact@v4
        with:
          name: heremate-private-drive-delivery-receipt
          path: ${{ runner.temp }}/drive-delivery-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary owner OAuth token material
        if: always()
        run: rm -f "$RUNNER_TEMP/drive-oauth.json"
