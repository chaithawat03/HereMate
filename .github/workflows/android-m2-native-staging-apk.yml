name: HereMate M2 Android APK — owner command or manual build

on:
  # Comment-only command from the authenticated repository owner, on Issue #43.
  # Every other comment is ignored at the job gate below.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Confirm integrated Android test APK (not Production): heremate/android-m2-staging"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: heremate-android-m2-native-test-rc
  cancel-in-progress: false

jobs:
  build-integrated-android-apk:
    if: >-
      github.repository == 'chaithawat03/HereMate' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' &&
        inputs.confirm_target == 'heremate/android-m2-staging') ||
       (github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.number == 43 &&
        github.event.issue.pull_request == null &&
        github.event.comment.body == '/heremate-build-m2-staging' &&
        github.event.comment.user.login == 'chaithawat03' &&
        github.event.comment.user.id == 29879036 &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.sender.login == 'chaithawat03' &&
        github.actor == 'chaithawat03'))
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_ENVIRONMENT: staging
      EXPO_PUBLIC_ENABLE_FIREBASE_GUEST: 'true'
      EXPO_PUBLIC_ENABLE_LOCAL_GPS: 'true'
      EXPO_PUBLIC_ENABLE_M1_PROFILE: 'true'
      EXPO_PUBLIC_ENABLE_M1_FRIENDS: 'true'
      EXPO_PUBLIC_ENABLE_GOOGLE_SIGNIN: 'true'
      EXPO_PUBLIC_ENABLE_M2_SHARING: 'true'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'package-lock.json'
      - name: Install locked Expo dependencies (no Expo billing)
        run: npm ci --no-audit --no-fund
      - name: Validate Android-only RC flags, native profile and TypeScript
        run: |
          node --test tests/m2-integrated-android-native-rc.test.mjs
          npm run typecheck
      - name: Generate Android native Gradle project locally
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Compile signed standalone Android release APK with bundled JS
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify installable release APK and record immutable SHA-256
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile
          import json,os
          apk=Path('android/app/build/outputs/apk/release/app-release.apk')
          with ZipFile(apk) as contents:
            if not any(name.endswith('index.android.bundle') for name in contents.namelist()):
              raise SystemExit('M2_ANDROID_RC_BLOCKED: JavaScript bundle missing from release APK')
          record={
            'sourceSha':os.environ['GITHUB_SHA'],
            'project':'heremate',
            'region':'asia-southeast1',
            'platform':'android',
            'scope':'M2-staging-owner-device-testing-only',
            'apkSha256':sha256(apk.read_bytes()).hexdigest(),
            'apkBytes':apk.stat().st_size,
          }
          Path('android-m2-rc-manifest.json').write_text(json.dumps(record,indent=2)+'\n')
          print('ANDROID_M2_RC_APK_VERIFIED: sha256='+record['apkSha256'])
          PY
      - name: Verify signed APK Google OAuth certificate before distribution
        run: |
          set -euo pipefail
          if [ "$EXPO_PUBLIC_ENABLE_GOOGLE_SIGNIN" != 'true' ]; then
            echo 'Google Sign-In disabled: no OAuth certificate claim'
            exit 0
          fi
          apk=android/app/build/outputs/apk/release/app-release.apk
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "$sdk_root/build-tools"
          mapfile -t candidates < <(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V)
          test "${#candidates[@]}" -gt 0
          apksigner="${candidates[${#candidates[@]}-1]}"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/heremate-android-signature.txt"
          # Google Android OAuth binds BOTH the signing SHA-1 and the actual
          # installed package. Inspect the compiled APK, not only app.json.
          mapfile -t aapt_candidates < <(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V)
          test "${#aapt_candidates[@]}" -gt 0
          aapt="${aapt_candidates[${#aapt_candidates[@]}-1]}"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/heremate-android-package.txt"
          node scripts/verify-android-google-oauth-signer.mjs \
            "$RUNNER_TEMP/heremate-android-signature.txt" \
            "$RUNNER_TEMP/heremate-android-package.txt"
      - name: Retain ONE Android Staging APK + SHA-256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: HereMate-M2-Android-Staging-Test-APK
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android-m2-rc-manifest.json
          if-no-files-found: error
          retention-days: 7
